<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Fidelidade — CashbackPro</title>
  <style>
    :root { --cbp-primary: #111827; --cbp-on-primary: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100vh; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff;
      color: #16211D;
    }
    #cashbackpro-root { min-height: 100vh; }
    .cbp-card { min-height: 100vh; display: flex; flex-direction: column; }
    .cbp-banner {
      background: var(--cbp-primary); color: var(--cbp-on-primary);
      padding: 40px 24px 34px; box-shadow: 0 2px 0 rgba(0,0,0,0.08);
    }
    .cbp-banner-inner { max-width: 640px; margin: 0 auto; width: 100%; }
    .cbp-brand { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; opacity: 0.85; }
    .cbp-banner-title { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
    .cbp-banner-subtitle { font-size: 14.5px; opacity: 0.85; margin: 0; }
    .cbp-body { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 36px 24px 48px; }
    .cbp-label { font-size: 13px; font-weight: 600; color: #5C6D67; display: block; margin-bottom: 6px; }
    .cbp-input {
      width: 100%; padding: 13px 14px; border: 1px solid #D5D9D7; border-radius: 4px;
      font-size: 16px; margin-bottom: 18px; color: #16211D;
      transition: border-color 0.15s ease;
    }
    .cbp-input:focus { outline: none; border-color: var(--cbp-primary); }
    .cbp-btn-primary {
      width: 100%; padding: 14px; border-radius: 4px; border: none;
      background: var(--cbp-primary); color: var(--cbp-on-primary); font-size: 15px; font-weight: 600; cursor: pointer;
      transition: filter 0.15s ease;
    }
    .cbp-btn-primary:hover:not(:disabled) { filter: brightness(0.88); }
    .cbp-btn-primary:disabled { opacity: 0.5; cursor: default; }
    .cbp-btn-secondary {
      width: 100%; padding: 12px; border-radius: 4px; border: 1px solid #D5D9D7;
      background: #fff; color: #16211D; font-size: 14px; font-weight: 600; cursor: pointer;
      margin-top: 12px;
    }
    .cbp-btn-secondary:hover { border-color: var(--cbp-primary); color: var(--cbp-primary); }
    .cbp-link {
      background: none; border: none; color: #5C6D67; font-size: 13px; cursor: pointer; padding: 4px;
      text-decoration: underline;
    }
    .cbp-link:hover { color: var(--cbp-primary); }
    .cbp-error {
      background: #FDECEA; color: #A82F1F; font-size: 13.5px; padding: 12px 14px;
      border-radius: 4px; margin-bottom: 18px; border-left: 3px solid #C0392B;
    }
    .cbp-success {
      background: #F3F4F6; color: var(--cbp-primary); font-size: 14.5px; padding: 16px 18px;
      border-radius: 4px; font-weight: 600; border-left: 3px solid var(--cbp-primary);
    }
    .cbp-header-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #EDEEED;
    }
    .cbp-avatar-name { display: flex; align-items: center; gap: 12px; }
    .cbp-avatar {
      width: 40px; height: 40px; border-radius: 6px; background: #F3F4F6; color: var(--cbp-primary);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;
    }
    .cbp-email { font-size: 14px; font-weight: 600; color: #16211D; }
    .cbp-logout { font-size: 12px; color: #999; cursor: pointer; text-decoration: underline; margin-top: 2px; }
    .cbp-balance-card {
      background: #F5F6F5; border-radius: 6px; padding: 26px; margin-bottom: 26px;
      border: 1px solid #EDEEED;
    }
    .cbp-balance-row { display: flex; align-items: baseline; gap: 10px; }
    .cbp-balance-number { font-size: 40px; font-weight: 700; color: var(--cbp-primary); line-height: 1; }
    .cbp-balance-label { font-size: 13px; color: #5C6D67; }
    .cbp-progress-track { height: 8px; background: #E4E7E6; border-radius: 4px; margin-top: 18px; overflow: hidden; }
    .cbp-progress-fill { height: 100%; background: var(--cbp-primary); border-radius: 4px; transition: width 0.4s ease; }
    .cbp-progress-hint { font-size: 13px; margin-top: 10px; color: #5C6D67; }
    .cbp-section-label {
      font-size: 13px; font-weight: 700; color: #16211D; text-transform: uppercase;
      letter-spacing: 0.4px; margin: 0 0 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cbp-tiers-section { margin-bottom: 26px; }
    .cbp-tier-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 4px; margin-bottom: 8px; background: #F8F9F8;
      border-left: 3px solid transparent;
    }
    .cbp-tier-active { background: #F3F4F6; }
    .cbp-tier-left { display: flex; align-items: center; gap: 10px; }
    .cbp-tier-icon { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .cbp-tier-name { font-size: 14px; font-weight: 600; color: #16211D; }
    .cbp-tier-meta { font-size: 12.5px; color: #5C6D67; }
    .cbp-tier-active .cbp-tier-meta { color: var(--cbp-primary); }
    .cbp-history-list { display: flex; flex-direction: column; margin-bottom: 26px; }
    .cbp-history-item {
      display: flex; justify-content: space-between; align-items: center; font-size: 14px;
      padding: 12px 0; border-bottom: 1px solid #EDEEED;
    }
    .cbp-history-item:last-child { border-bottom: none; }
    .cbp-history-date { color: #5C6D67; }
    .cbp-history-points { color: var(--cbp-primary); font-weight: 700; }
    .cbp-empty-hint { font-size: 13.5px; color: #999; padding: 8px 0; }
    .cbp-disclaimer { font-size: 12.5px; color: #999; margin-top: 14px; line-height: 1.4; }
    .cbp-skeleton { height: 110px; border-radius: 6px; background: #F0F1F0; margin-bottom: 26px; }
  </style>
</head>
<body>
  <div id="cashbackpro-root"></div>
  <script src="fidelidade-page.js"></script>
</body>
</html>
